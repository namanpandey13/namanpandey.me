<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>namanpandey.me</title>
    <style>
        /* Classic Windows 2000 Desktop Background */
        body {
            background-color: #008080; /* Classic Teal */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
            color: #000;
        }

        /* The Main Window */
        .window {
            background-color: #d4d0c8;
            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;
            width: 320px;
            box-shadow: 1px 1px 0 #000;
            padding: 2px;
            position: relative;
        }

        /* Blue Title Bar */
        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            padding: 3px 2px 3px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        /* Fake Window Controls (Close/Minimize/Maximize) */
        .title-bar-controls {
            display: flex;
            gap: 2px;
        }
        .title-bar-button {
            background: #d4d0c8;
            border: 1px solid;
            border-color: #fff #404040 #404040 #fff;
            width: 16px;
            height: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        .title-bar-button:active {
            border-color: #404040 #fff #fff #404040;
        }

        /* Inside the Window */
        .window-body {
            padding: 20px;
            text-align: center;
        }

        .quote {
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Classic Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            position: relative;
            background: #d4d0c8;
            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;
            padding: 6px 12px;
            text-decoration: none;
            color: black;
            font-size: 12px;
            cursor: pointer;
            box-shadow: inset 1px 1px #dfdfdf, inset -1px -1px #808080;
            display: block;
        }

        .btn:active {
            border-color: #404040 #fff #fff #404040;
            box-shadow: inset 1px 1px #000;
            padding: 7px 11px 5px 13px; /* Shift text slightly when clicked */
        }

        /* Large QR Code Hover Effect */
        .qr-popup {
            display: none;
            position: absolute;
            bottom: 110%; /* Pop up above the button */
            left: 50%;
            transform: translateX(-50%);
            background: #d4d0c8;
            border: 2px solid;
            border-color: #fff #404040 #404040 #fff;
            padding: 6px;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.6);
            z-index: 100;
        }

        /* Increased size to 250px */
        .qr-popup img {
            display: block;
            width: 250px;
            height: 250px;
            image-rendering: pixelated; /* Keeps the QR code crisp */
        }

        .qr-popup p {
            margin: 6px 0 0 0;
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }

        .btn:hover .qr-popup {
            display: block;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">namanpandey.exe</div>
            <div class="title-bar-controls">
                <div class="title-bar-button">_</div>
                <div class="title-bar-button">□</div>
                <div class="title-bar-button">X</div>
            </div>
        </div>
        <div class="window-body">
            <div class="quote">
                "Life is lived in the arena."
            </div>
            
            <div class="links-container">
                
                <a href="https://www.linkedin.com/in/namanpandey0796/" target="_blank" class="btn">
                    LinkedIn
                    <div class="qr-popup">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.linkedin.com/in/namanpandey0796/" alt="LinkedIn QR">
                        <p>Scan to connect</p>
                    </div>
                </a>

                <a href="https://readysetdopodcast.com" target="_blank" class="btn">
                    Podcast
                    <div class="qr-popup">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://readysetdopodcast.com" alt="Podcast QR">
                        <p>Scan to listen</p>
                    </div>
                </a>

                <a href="https://www.youtube.com/channel/UCj5yt4hoYmvmpIiw_ENLFQA/" target="_blank" class="btn">
                    YouTube
                    <div class="qr-popup">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.youtube.com/channel/UCj5yt4hoYmvmpIiw_ENLFQA/" alt="YouTube QR">
                        <p>Scan to watch</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
